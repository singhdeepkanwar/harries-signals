version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: harrie_backend
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data          # persist SQLite DB
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: harrie_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  screener:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: harrie_screener
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data
    # Runs the intraday screener in daemon mode (auto-starts at 9:14 AM IST daily)
    command: python ../intraday_screener/screener.py --daemon
    depends_on:
      - backend
